# Render 배포 설정 (Blueprint).
# Render 대시보드에서 이 저장소를 연결하면 이 파일을 읽어 자동으로 서비스를 만든다.
services:
  - type: web
    name: yt-distill-reader
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Anthropic 키는 더 이상 서버에 두지 않는다 — Claude 호출은 사용자 브라우저가
      # 본인 키로 직접 하므로(Render→Anthropic 끊김 우회), 서버에는 자막 키만 둔다.
      # (추천) 자막 추출 전문 API 키 — 링크 자동 추출 안정화. 대시보드에서 입력.
      - key: SUPADATA_API_KEY
        sync: false
      # (선택) 유튜브 차단 우회용 주거용 프록시. 필요할 때만 대시보드에서 입력.
      - key: YT_PROXY
        sync: false
      # (선택) Jina 무료 API 키 — 유튜브 자막 추출 성공률 향상. 대시보드에서 입력.
      - key: JINA_API_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
